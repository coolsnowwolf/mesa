name: Sync upstream Mesa

on:
  schedule:
    # 02:23 Asia/Shanghai (GitHub cron uses UTC).
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-mesa
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out mirror repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Synchronize branches and tags
        env:
          UPSTREAM_URL: https://gitlab.freedesktop.org/mesa/mesa.git
        shell: bash
        run: |
          set -euo pipefail

          workflow_file="$(mktemp)"
          cp .github/workflows/sync-upstream.yml "$workflow_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_URL"
          git fetch --prune --force upstream \
            '+refs/heads/*:refs/remotes/upstream/*' \
            '+refs/tags/*:refs/tags/*'
          git fetch --prune origin \
            '+refs/heads/*:refs/remotes/origin/*'

          while IFS= read -r upstream_ref; do
            branch="${upstream_ref#refs/remotes/upstream/}"
            if [[ "$branch" == main ]]; then
              continue
            fi
            if [[ "$(git rev-parse "$upstream_ref")" == \
              "$(git rev-parse "refs/remotes/origin/$branch" 2>/dev/null || true)" ]]; then
              continue
            fi
            git push --force origin \
              "$upstream_ref:refs/heads/$branch"
          done < <(git for-each-ref \
            --format='%(refname)' refs/remotes/upstream/)

          while IFS= read -r origin_ref; do
            branch="${origin_ref#refs/remotes/origin/}"
            if [[ "$branch" == main ]]; then
              continue
            fi
            if ! git show-ref --verify --quiet \
              "refs/remotes/upstream/$branch"; then
              git push origin ":refs/heads/$branch"
            fi
          done < <(git for-each-ref \
            --format='%(refname)' refs/remotes/origin/)

          # GitHub rejects these legacy tags because their reachable history
          # contains Git objects that fail GitHub's server-side fsck checks.
          readarray -t rejected_tags <<'EOF'
          R300_DRIVER_0
          before_upgrade_03_01_05
          blended_fountain
          embedded-1-20030120
          embedded-1-20030224
          embedded-1-20030305
          embedded-1-20030324
          embedded-1-20030417
          embedded-1-20030502
          gliding_penguin
          jump_and_click
          kw-mesa-1
          mesa-6_5-20060712
          mesa_20050504
          mesa_20050526
          mesa_20050610
          mesa_20050715
          mesa_20060201
          mesa_20060325
          mesa_3_1
          mesa_3_1_beta_3
          mesa_3_2
          mesa_3_2_1
          mesa_3_2_beta_1
          mesa_3_3
          mesa_3_4
          mesa_3_4_1
          mesa_3_4_2
          mesa_3_5
          mesa_4_0
          mesa_4_0_1
          mesa_4_0_2
          mesa_4_0_3
          mesa_4_0_4
          mesa_4_1
          mesa_5_0
          mesa_5_0_1
          mesa_6_3
          mesa_6_3_1
          mesa_6_3_1_1
          mesa_6_3_2
          mesa_6_4
          mesa_6_4_1
          mesa_6_4_2
          mesa_6_5
          mesa_6_5_1
          mesa_6_5_2
          mesa_texman_20060210
          noisy_cube
          red_tinted_cube
          rotating_gears
          shimmering_gears
          start
          texman_0_1_20060325
          texman_0_1_20060330
          texman_0_1_20060621
          texman_0_1_20060705
          texman_0_1_pre_ttm
          texmem_0_2_20060912
          texmem_0_3_20060923
          texmem_0_3_20060929
          the_perfect_frag
          trunk_20040329
          unichrome-last-xinerama
          vtx-0-2-21112003-freeze
          vtx-0-2-24112003
          EOF

          declare -A rejected_tag_set=()
          for tag in "${rejected_tags[@]}"; do
            rejected_tag_set["refs/tags/$tag"]=1
          done

          declare -A origin_tags=()
          while read -r oid tag_ref; do
            [[ "$tag_ref" == *'^{}' ]] && continue
            origin_tags["$tag_ref"]="$oid"
          done < <(git ls-remote --tags origin)

          while IFS= read -r tag_ref; do
            if [[ -n "${rejected_tag_set[$tag_ref]:-}" ]]; then
              continue
            fi
            tag_oid="$(git rev-parse "$tag_ref")"
            if [[ "${origin_tags[$tag_ref]:-}" == "$tag_oid" ]]; then
              unset 'origin_tags[$tag_ref]'
              continue
            fi
            if ! git push --force origin "$tag_ref:$tag_ref"; then
              echo "::warning title=Rejected upstream tag::$tag_ref could not be mirrored"
            fi
            unset 'origin_tags[$tag_ref]'
          done < <(git for-each-ref --format='%(refname)' refs/tags/)

          for tag_ref in "${!origin_tags[@]}"; do
            git push origin ":$tag_ref"
          done

          upstream_main="$(git rev-parse refs/remotes/upstream/main)"
          origin_main="$(git rev-parse refs/remotes/origin/main)"
          origin_parent="$(git rev-parse refs/remotes/origin/main^ 2>/dev/null || true)"

          if [[ "$origin_parent" == "$upstream_main" ]]; then
            exit 0
          fi

          git switch --detach refs/remotes/upstream/main
          mkdir -p .github/workflows
          cp "$workflow_file" .github/workflows/sync-upstream.yml
          git add .github/workflows/sync-upstream.yml

          if ! git diff --cached --quiet; then
            git commit --signoff -m "ci: preserve daily upstream synchronization"
          fi

          git push --force-with-lease="refs/heads/main:$origin_main" \
            origin HEAD:refs/heads/main
